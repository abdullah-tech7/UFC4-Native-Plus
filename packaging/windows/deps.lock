# SacredFire Windows cross-build inputs. One entry per line: name kind source ref [licence] [role]
#   kind archive: a downloaded file, ref = sha256:<hex> (verified; "sha256:-" means not pinned yet,
#                 scripts/windows/fetch-deps.sh --pin records what it downloaded)
#   kind git:     a repository checked out at the exact commit in ref (submodules included)
# role: toolchain (runs on the Linux host), target (compiled for Windows), header (headers only),
#       host-tool (runs on Linux during the build), runtime (shipped in the package, not compiled).
# Versions follow the Linux build on 2026-10-11 (Arch: SDL 3.4.18, Vulkan 1.4.363, fmt 12.2.0,
# xxHash 0.8.4, miniz 3.1.2, Zydis 4.1.1, Boost 1.92.0, robin-map 1.4.x; tools/deps.sh: VMA 3.3.0,
# magic_enum 0.9.7, xbyak 7.30). FFmpeg is not an input: CTR imports no AvPlayer/videodec function
# (out/import_names.txt), so the Windows build leaves the AvPlayer sources out (BB_AVPLAYER=OFF).
